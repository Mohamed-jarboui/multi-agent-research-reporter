name: Deploy demo

# Pushes the service to a Hugging Face Gradio Space (needs paid hardware) by hand
# (the ref the run is started on is checked out, so dispatching on a branch deploys that branch). The Space runs app.py: a Gradio page plus our FastAPI service.
# Needs the secret HF_TOKEN (a write token). The Space id is the repository variable
# HF_SPACE_ID ("owner/name"); the default below is only a placeholder. Without HF_TOKEN the
# deploy step is skipped with a notice and the workflow still succeeds.
# Manual only. The Hugging Face free tier (ZeroGPU) refused this app ("No @spaces.GPU function
# detected during startup") and CPU basic needs a paid plan, so a push trigger would only fail.
# The live demo runs on Render (render.yaml, docs/deploy_render.md). Run this by hand only for a
# paid Hugging Face plan.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'Jarbouii/research-reporter' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Check the token
        id: gate
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::HF_TOKEN not set, deploy skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export only the files the Space needs
        if: steps.gate.outputs.skip != 'true'
        run: |
          rm -rf /tmp/space && mkdir -p /tmp/space
          cp deploy/space_app.py /tmp/space/app.py
          cp deploy/space_README.md /tmp/space/README.md
          cp -r src /tmp/space/src
          # runtime dependencies only, from the lock file (no dev or report group, no project).
          # The web stack is left out on purpose: the Space has gradio pre-installed at the
          # sdk_version in the README, and gradio brings its own compatible fastapi, starlette,
          # uvicorn, pydantic, httpx, huggingface-hub, pillow, numpy and friends. Pinning ours
          # next to them could break the pre-installed gradio.
          skip=""
          for pkg in fastapi starlette uvicorn pydantic pydantic-core httpx httpcore h11 anyio \
                     huggingface-hub pillow numpy orjson pyyaml typing-extensions annotated-types \
                     annotated-doc click; do
            skip="$skip --no-emit-package $pkg"
          done
          uv export --locked --no-dev --no-group report --no-hashes --no-emit-project \
            --no-header $skip -o /tmp/space/requirements.txt
          find /tmp/space -name __pycache__ -type d -prune -exec rm -rf {} +
          echo "Files going to the Space:"
          (cd /tmp/space && find . -type f | sort)

      - name: Push to the Space
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "::add-mask::$HF_TOKEN"
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          # the token only appears in this URL, which is masked in the log
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" main \
            2>&1 | sed "s/${HF_TOKEN}/***/g"
          exit "${PIPESTATUS[0]}"

      - name: Wait for the Space to be healthy
        if: steps.gate.outputs.skip != 'true'
        run: |
          host="$(echo "$HF_SPACE_ID" | tr '/_' '--' | tr '[:upper:]' '[:lower:]').hf.space"
          echo "Polling https://${host}/health for up to 20 minutes"
          for i in $(seq 1 120); do
            if curl -fsS --max-time 10 "https://${host}/health" | grep -q '"status":"ok"'; then
              echo "Space is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the Space did not become healthy in 20 minutes"
          exit 1
